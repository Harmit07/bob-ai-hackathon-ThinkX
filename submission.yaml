submission:
  title: "AI-Powered Grid Load Optimization & Renewable Energy Performance Advisor"

  problem_statement: >
    Modern power grids face increasing operational complexity due to variable renewable energy
    growth, sudden demand spikes, transmission constraints, and renewable curtailment. Grid
    operators lack real-time AI-powered decision support, resulting in wasted clean energy and
    grid instability.

  solution_summary: >
    We built a full-stack AI advisor that combines XGBoost load forecasting, Isolation Forest
    anomaly detection, and a greedy optimization engine with LLM-ready Root Cause Analysis.
    The system monitors grid conditions in real-time, predicts the next 24 hours, detects
    anomalies, and delivers actionable natural-language recommendations to grid operators.
    Tagline: Predict the problem. Explain the cause. Optimize the response.

  key_features:
    - "Real-time grid monitoring: demand, solar, wind, frequency, reserve margin, curtailment"
    - "24-hour load and renewable forecasting using XGBoost with curtailment risk scoring"
    - "Anomaly detection using Isolation Forest + rule-based engine (demand spikes, frequency deviations, low reserves)"
    - "Greedy dispatch optimization with storage charging and load-shifting recommendations"
    - "AI Root Cause Analysis advisor with structured RCA narrative (watsonx.ai integration-ready)"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "Next.js", "React"]
    ibm_technologies: ["IBM Bob", "watsonx.ai (integration-ready)"]
    databases: []
    other: ["XGBoost", "scikit-learn", "ECharts", "Tailwind CSS", "pandas", "numpy", "uvicorn"]

  what_we_are_most_proud_of: >
    The end-to-end advisory pipeline: raw grid telemetry → ML anomaly detection →
    optimization recommendations → human-readable Root Cause Analysis narrative,
    all in a single API call (GET /api/advisor/). The architecture is production-realistic
    and directly extensible with live EIA/NOAA/NREL data sources and watsonx.ai LLM.

  known_limitations: >
    Grid data is simulated (live API integration path is documented). LLM narrative
    uses rule-based RCA — watsonx.ai is stubbed and ready for connection. No authentication
    layer. Optimization uses greedy dispatch; production would use Pyomo/OR-Tools LP solver.

